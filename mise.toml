[tools]
# JDK 21 for Gradle/IPGP; Python + uv are used only by the stdlib-only generator.
java = "corretto-21"
python = "3.13"
uv = "0.9.26"

[tasks.generate]
description = "Regenerate theme resources from the pinned palette"
run = "uv run tools/generate.py"

[tasks.build]
description = "Build the plugin zip"
run = "./gradlew buildPlugin"

[tasks.check]
description = "Generator drift check + buildPlugin (the pre-land gate)"
run = "uv run tools/generate.py --check && ./gradlew buildPlugin"

[tasks.sign]
description = "Build and sign the plugin zip (requires CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD)"
run = "./gradlew signPlugin"

[tasks.publish]
description = "Sign and publish to JetBrains Marketplace (requires signing secrets + PUBLISH_TOKEN)"
run = "./gradlew publishPlugin"

[tasks.demo]
description = "Launch a sandbox IDE with Tokyo Night preselected for screenshots"
run = "./gradlew runIde --args=$PWD/screenshots/sample-project"
